<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="description"
    content="A tiny dinosaur game played entirely in your browser's URL bar 🦕">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes">
  <title>URL-Dinogame</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="application-name" content="URL-Dinogame">
  <meta name="msapplication-TileColor" content="#1a1a1a">
  <meta name="theme-color" content="#f0ebe3">

  <!-- PeerJS CDN — must load before multiplayer.js -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!--
    Vanilla JS files served from /public/js/.
    They are deferred so the React app mounts first,
    then these run in order: idb → toast → multiplayer → room-ui → script → settings → click-sound
  -->
  <script src="./js/idb-store.js" defer></script>
  <script src="./js/toast.js" defer></script>
  <script src="./js/multiplayer.js" defer></script>
  <script src="./js/room-ui.js" defer></script>
  <script src="./js/script.js" defer></script>
  <script src="./js/settings.js" defer></script>
  <script src="./js/click-sound.js" defer></script>
</head>

<body class="no-js preload">
  <div id="root"></div>

  <audio id="countdown" src="assets/audio/countdown3s.mp3" preload="auto"></audio>
  <audio id="gameover"  src="assets/audio/faaah.mp3"       preload="auto"></audio>
  <audio id="faaah"     src="assets/audio/faaah.mp3"        preload="auto"></audio>
  <audio id="toggle-sound" src="assets/audio/switch-on.mp3" preload="auto"></audio>
  <audio id="join-sound"   src="assets/audio/join.mp3"      preload="auto"></audio>
  <audio id="leave-sound"  src="assets/audio/leave.mp3"     preload="auto"></audio>
  <audio id="click-sound"  src="assets/audio/click-soft.mp3" preload="auto"></audio>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
